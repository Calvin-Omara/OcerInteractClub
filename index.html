            background: linear-gradient(135deg, #00205B 0%, #1B365D 60%, #0d1b2a 100%);

        .hero-pattern {
            background-image: radial-gradient(rgba(247, 168, 27, 0.15) 1px, transparent 1px);

        }
        .id-card-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 32, 91, 0.35), 0 0 0 1px rgba(247, 168, 27, 0.3);
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #printableBadge, #printableBadge * {
                visibility: visible;
            }
            #printableBadge {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 100%;
                max-width: 400px;
                box-shadow: none !important;
            }
        }
    </style>
